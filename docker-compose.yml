services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
    - 5672:5672
    - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: acadprep-sqlserver
    ports:
    - 1433:1433
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Password123!
    healthcheck:
      test:
      - CMD
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - localhost
      - -U
      - sa
      - -P
      - Password123!
      - -C
      - -Q
      - SELECT 1
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20
    volumes:
    - sqlserver-data:/var/opt/mssql
  identity.api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.API/Dockerfile
    container_name: acadprep-identity-api
    ports:
    - 5001:5001
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://0.0.0.0:5001
    - Urls=http://0.0.0.0:5001
    - ConnectionStrings__Default=Server=sqlserver,1433;Database=AcadPrep_IdentityDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
    - Redis__ConnectionString=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
  content.api:
    build:
      context: .
      dockerfile: src/Services/Content/Dockerfile
    ports:
    - 5006:5006
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - Urls=http://0.0.0.0:5006
    - ConnectionStrings__Default=Server=sqlserver,1433;Database=AcadPrep_ContentDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
    - Services__ExamApi=http://exam.api:5003
    - InternalApiKey=${ACADPREP_INTERNAL_API_KEY:-AcadPrep_Local_Exam_Content_ChangeBeforeDeploy}
    - Jwt__PublicKeyPath=/app/keys/public_key.pem
    volumes:
    - type: bind
      source: ./src/Services/Identity/Identity.API/keys/public_key.pem
      target: /app/keys/public_key.pem
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      sqlserver:
        condition: service_healthy
  learning.api:
    build:
      context: .
      dockerfile: src/Services/Learning/Dockerfile
    ports:
    - 5005:5005
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - Urls=http://0.0.0.0:5005
    - ConnectionStrings__Default=Server=sqlserver,1433;Database=AcadPrep_LearningDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
    - ConnectionStrings__Redis=redis:6379
    - RabbitMQ__Host=rabbitmq
    - Exam__BaseUrl=http://exam.api:5003/
    - Exam__ApiKey=${ACADPREP_INTERNAL_API_KEY:-AcadPrep_Local_Exam_Content_ChangeBeforeDeploy}
    - Jwt__PublicKeyPath=/app/keys/public_key.pem
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
      exam.api:
        condition: service_started
    volumes:
    - type: bind
      source: ./src/Services/Identity/Identity.API/keys/public_key.pem
      target: /app/keys/public_key.pem
      read_only: true
      bind:
        create_host_path: false
  exam.api:
    build:
      context: .
      dockerfile: src/Services/Exam/Dockerfile
    container_name: acadprep-exam-api
    ports:
    - 5003:5003
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://0.0.0.0:5003
    - Urls=http://0.0.0.0:5003
    - ConnectionStrings__Default=Server=sqlserver,1433;Database=AcadPrep_ExamDb;User Id=sa;Password=Password123!;TrustServerCertificate=True
    - RabbitMQ__Host=rabbitmq
    - RabbitMQ__Port=5672
    - RabbitMQ__UserName=guest
    - RabbitMQ__Password=guest
    - Content__BaseUrl=http://content.api:5006/
    - Content__ApiKey=${ACADPREP_INTERNAL_API_KEY:-AcadPrep_Local_Exam_Content_ChangeBeforeDeploy}
    - InternalApiKey=${ACADPREP_INTERNAL_API_KEY:-AcadPrep_Local_Exam_Content_ChangeBeforeDeploy}
    - Jwt__PublicKeyPath=/app/keys/public_key.pem
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      content.api:
        condition: service_started
    volumes:
    - type: bind
      source: ./src/Services/Identity/Identity.API/keys/public_key.pem
      target: /app/keys/public_key.pem
      read_only: true
      bind:
        create_host_path: false
  apigateway:
    build:
      context: .
      dockerfile: src/ApiGateways/ApiGateway/Dockerfile
    container_name: acadprep-apigateway
    ports:
    - 5080:5080
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://0.0.0.0:5080
    - Urls=http://0.0.0.0:5080
    - ReverseProxy__Clusters__exam__Destinations__d1__Address=http://exam.api:5003/
    - ReverseProxy__Clusters__content__Destinations__d1__Address=http://content.api:5006/
    - ReverseProxy__Clusters__learning__Destinations__d1__Address=http://learning.api:5005/
    - ReverseProxy__Clusters__identity__Destinations__d1__Address=http://identity.api:5001/
    - ReverseProxy__Clusters__notification__Destinations__d1__Address=http://notifications.api:8080/
    - ReverseProxy__Clusters__billing__Destinations__d1__Address=http://billing.api:8080/
    - ReverseProxy__Clusters__ai__Destinations__d1__Address=http://ai.api:8080/
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
    - exam.api
    - learning.api
    - identity.api
  storefront.web:
    build:
      context: .
      dockerfile: src/Web/Storefront.Web/Dockerfile
    container_name: acadprep-storefront-web
    ports:
    - 5100:5100
    environment:
    - ASPNETCORE_ENVIRONMENT=Development
    - ASPNETCORE_URLS=http://0.0.0.0:5100
    - Urls=http://0.0.0.0:5100
    - GatewayUrl=http://apigateway:5080
    depends_on:
    - apigateway
  notifications.api:
    build:
      context: .
      dockerfile: src/Services/Notification/Notifications.API/Dockerfile
    ports:
    - 5010:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: '8080'
      ASPNETCORE_URLS: http://+:8080
      Urls: http://+:8080
      ConnectionStrings__Default: "${NOTIFICATIONS_CONNECTION_STRING:?Set NOTIFICATIONS_CONNECTION_STRING in .env}"
      Jwt__PublicKeyPath: /app/keys/public_key.pem
      # Admin notifications verify the recipient through Identity's existing Admin API (container DNS).
      Identity__BaseUrl: http://identity.api:5001/
      # Billing reminder events (UC-23.3); same local broker settings as exam.api.
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      # Real SMTP from the environment only (never committed). Empty Host/From: in-app notification only.
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Smtp__FromName: ${SMTP_FROM_NAME:-}
    volumes:
    - type: bind
      source: ./src/Services/Identity/Identity.API/keys/public_key.pem
      target: /app/keys/public_key.pem
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      sqlserver:
        condition: service_healthy
      identity.api:
        condition: service_started
      rabbitmq:
        condition: service_started
  billing.api:
    build:
      context: .
      dockerfile: src/Services/Billing/Billing.API/Dockerfile
    ports:
      - "5011:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "${BILLING_CONNECTION_STRING:?Set BILLING_CONNECTION_STRING in .env}"
      Jwt__PublicKeyPath: /app/keys/public_key.pem
      # Grant verifies the recipient through Identity's existing Admin API (container DNS, not localhost).
      Identity__BaseUrl: http://identity.api:5001/
      # Revenue statistics cache (UC-21.5); Redis failures fall back to the database.
      Redis__ConnectionString: redis:6379
      # VNPay sandbox credentials from .env only (UC-21.2); empty = checkout returns 503.
      Vnpay__TmnCode: ${VNPAY_TMN_CODE:-}
      Vnpay__HashSecret: ${VNPAY_HASH_SECRET:-}
      # UC-23.2 AI usage section reads ai-service through container DNS.
      AiService__BaseUrl: http://ai.api:8080/
      # Reminder/expiry events go through the outbox to RabbitMQ (UC-23.3).
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: '5672'
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
    volumes:
      - type: bind
        source: ./src/Services/Identity/Identity.API/keys/public_key.pem
        target: /app/keys/public_key.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      sqlserver:
        condition: service_healthy
      identity.api:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  ai.api:
    build:
      context: .
      dockerfile: src/Services/Ai/Ai.API/Dockerfile
    ports:
      - "5012:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "${AI_CONNECTION_STRING:?Set AI_CONNECTION_STRING in .env}"
      Jwt__PublicKeyPath: /app/keys/public_key.pem
      # Gemini key from .env only (never committed or logged).
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      # Effective plan for token limits (Billing GET /api/subscriptions/me with the learner's JWT).
      Billing__BaseUrl: http://billing.api:8080/
    volumes:
      - type: bind
        source: ./src/Services/Identity/Identity.API/keys/public_key.pem
        target: /app/keys/public_key.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      sqlserver:
        condition: service_healthy
      billing.api:
        condition: service_started

volumes:
  identity-data: null
  sqlserver-data:
    name: acadprep-sqlserver-data
